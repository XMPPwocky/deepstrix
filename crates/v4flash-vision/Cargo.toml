[package]
name = "v4flash-vision"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
color-eyre = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# PENDING USER SIGN-OFF — see the note in the workspace Cargo.toml.
image = { workspace = true }
v4flash-core = { path = "../v4flash-core" }
v4flash-hip = { path = "../v4flash-hip" }
# NOT v4flash-kernels: the tower has its own kernels (kernels/vit.hip) and
# shares only v4flash-core (GGUF/safetensors readers, f16) and v4flash-hip
# with the engine. The text-side pieces live in the engine crate.


[lib]
path = "src/lib.rs"
