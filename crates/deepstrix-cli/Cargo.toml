[package]
name = "deepstrix-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
v4flash-core = { path = "../v4flash-core" }
v4flash-hip = { path = "../v4flash-hip" }
v4flash-kernels = { path = "../v4flash-kernels" }
color-eyre = { workspace = true }

[[bin]]
name = "deepstrix-chat"
path = "src/bin/chat.rs"

[[bin]]
name = "laguna-chat"
path = "src/bin/laguna_chat.rs"

[[bin]]
name = "laguna-oracle-gen"
path = "src/bin/laguna_oracle_gen.rs"

[features]
# No-op since 2026-09-24: V4.1-Flash is the only DeepSeek model (V4-Flash was
# dropped). Kept so existing `--features v41` build commands keep working.
v41 = ["v4flash-kernels/v41"]
