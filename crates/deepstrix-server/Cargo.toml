[package]
name = "deepstrix-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
v4flash-core = { path = "../v4flash-core" }
v4flash-hip = { path = "../v4flash-hip" }
v4flash-kernels = { path = "../v4flash-kernels" }
v4flash-vision = { path = "../v4flash-vision" }

# Workspace-approved already.
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
blake3 = { workspace = true }
# DSpark K exploration draws (owner OK 10-01); 0.8.6 is already in Cargo.lock.
rand = "0.8"

# Differential prompt / output-parse oracle tests only (tests/oracle_prompt.rs).
# Owner sign-off 2026-10-17 for exactly these two dev-dependencies; never move
# them to [dependencies]. deepseek-recipe = DeepSeek's official reference
# implementation (MIT), pinned to an exact commit; deepseek-recipe-image
# (OpenCV) is NOT pulled.
[dev-dependencies]
proptest = "=1.12.0"
deepseek-recipe = { git = "https://github.com/deepseek-ai/deepseek-recipe", rev = "8cadfede7063c896b944e7bae05daa3549ae97ea" }
deepseek-recipe-core = { git = "https://github.com/deepseek-ai/deepseek-recipe", rev = "8cadfede7063c896b944e7bae05daa3549ae97ea" }
deepseek-recipe-encoding = { git = "https://github.com/deepseek-ai/deepseek-recipe", rev = "8cadfede7063c896b944e7bae05daa3549ae97ea" }
# The reference tokenizer for the token-id leg (owner OK 2026-10-17): the
# exact version deepseek-recipe already pulls in, so no crate is added.
tokenizers = "=0.23.2"

[[bin]]
name = "deepstrix-server"
path = "src/main.rs"

[[bin]]
name = "deepstrix-tok-dump"
path = "src/bin/tok-dump.rs"

[[bin]]
name = "deepstrix-vector-test"
path = "src/bin/vector-test.rs"

[features]
# Model selection (non-additive!): compile for DeepSeek-V4.1-Flash instead of V4-Flash.
# Never unify with --all-features; build V4.1 in its own CARGO_TARGET_DIR (docs/v41/ENGINE_PORT.md §0).
v41 = ["v4flash-kernels/v41"]
