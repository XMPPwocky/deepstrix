[package]
name = "deepstrix-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
v4flash-core = { path = "../v4flash-core" }
v4flash-hip = { path = "../v4flash-hip" }
v4flash-kernels = { path = "../v4flash-kernels" }
v4flash-vision = { path = "../v4flash-vision" }

# Workspace-approved already.
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
blake3 = { workspace = true }
# DSpark K exploration draws (owner OK 10-01); 0.8.6 is already in Cargo.lock.
rand = "0.8"

[[bin]]
name = "deepstrix-server"
path = "src/main.rs"

[[bin]]
name = "deepstrix-tok-dump"
path = "src/bin/tok-dump.rs"

[[bin]]
name = "deepstrix-vector-test"
path = "src/bin/vector-test.rs"

[features]
# No-op since 2026-09-24: V4.1-Flash is the only DeepSeek model (V4-Flash was
# dropped). Kept so existing `--features v41` build commands keep working.
v41 = ["v4flash-kernels/v41"]
