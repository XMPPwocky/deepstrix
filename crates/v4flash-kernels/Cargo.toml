[package]
name = "v4flash-kernels"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-perfetto = { workspace = true }
v4flash-hip = { path = "../v4flash-hip" }
v4flash-core = { path = "../v4flash-core" }

[lib]
path = "src/lib.rs"

[features]
# Model selection (non-additive!): compile for DeepSeek-V4.1-Flash instead of V4-Flash.
# Never unify with --all-features; build V4.1 in its own CARGO_TARGET_DIR (docs/v41/ENGINE_PORT.md §0).
v41 = []
