[package]
name = "v4flash-kernels"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-perfetto = { workspace = true }
v4flash-hip = { path = "../v4flash-hip" }
v4flash-core = { path = "../v4flash-core" }

[lib]
path = "src/lib.rs"

[features]
# No-op since 2026-09-24: V4.1-Flash is the only DeepSeek model (V4-Flash was
# dropped). Kept so existing `--features v41` build commands keep working.
v41 = []
