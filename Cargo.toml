[workspace]
resolver = "2"
members = [
    "crates/v4flash-core",
    "crates/v4flash-hip",
    "crates/v4flash-kernels",
    "crates/deepstrix-cli",
    "crates/deepstrix-server",
    "crates/v4flash-vision",
    "crates/phase0",
    "crates/phase1",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Approved deps (user sign-off 2026-05-23). Versions verified against crates.io.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Perfetto trace export (user-approved 2026-05-24). Optional; only the
# v4flash-kernels test binary opts in.
tracing-perfetto = "0.1.5"
color-eyre = "0.6.5"
thiserror = "2.0.18"
memmap2 = "0.9.10"
# eyre is re-exported by color-eyre; library code uses eyre::Result and binaries
# install the color-eyre handler in main().

# Approved for deepstrix-server (user sign-off 2026-06-01).
#   tokio:  async runtime backing axum; tokio-rs official.
#   axum:   HTTP framework on hyper+tower; OpenAI /v1/chat/completions + SSE.
#   blake3: snapshot-key hashing over token-id byte sequences.
#   uuid:   v7 ids for OpenAI tool-call ids.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal", "io-util", "time"] }
axum = "0.8.9"
blake3 = "1.8.5"
uuid = { version = "1.23.2", features = ["v7"] }
# Combinators on tokio mpsc / futures Streams used by SSE handler.
futures-util = "0.3"

# *** PENDING USER SIGN-OFF (vision-exp, 2026-09-03) ***
#   image: PNG/JPEG decoding for the DeepSeek-V4-Flash-Vision-Exp image
#   preprocessor (crates/v4flash-vision). Only `decode -> RGB8` is used;
#   resizing/padding/normalisation are implemented in-crate (PIL semantics).
#
#   REAL SURFACE BEING SIGNED OFF — 14 crates enter Cargo.lock, not two:
#     image
#     png, fdeflate, flate2, miniz_oxide, zlib-rs, crc32fast, simd-adler32  (PNG)
#     zune-jpeg, zune-core                                                  (JPEG)
#     bytemuck, byteorder-lite                                              (glue)
#     moxcms, pxfm                                                          (ICC colour math)
#   moxcms/pxfm are NON-OPTIONAL dependencies of image 0.25.10, so
#   `default-features = false` cannot drop them — this crate cannot be
#   reduced to "just the two codecs".
#
#   Narrower alternative if that surface is unwanted: depend on `png` and
#   `zune-jpeg` directly and sniff the format in `preprocess::decode_rgb`.
#   That drops image, moxcms, pxfm, bytemuck and byteorder-lite (5 of 14)
#   at the cost of hand-rolling the DynamicImage -> RGB8 conversion.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

