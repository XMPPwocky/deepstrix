[workspace]
resolver = "2"
members = [
    "crates/v4flash-core",
    "crates/v4flash-hip",
    "crates/v4flash-kernels",
    "crates/deepstrix-cli",
    "crates/deepstrix-server",
    "crates/phase0",
    "crates/phase1",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Approved deps (user sign-off 2026-05-23). Versions verified against crates.io.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Perfetto trace export (user-approved 2026-05-24). Optional; only the
# v4flash-kernels test binary opts in.
tracing-perfetto = "0.1.5"
color-eyre = "0.6.5"
thiserror = "2.0.18"
memmap2 = "0.9.10"
# eyre is re-exported by color-eyre; library code uses eyre::Result and binaries
# install the color-eyre handler in main().

# Approved for deepstrix-server (user sign-off 2026-06-01).
#   tokio:  async runtime backing axum; tokio-rs official.
#   axum:   HTTP framework on hyper+tower; OpenAI /v1/chat/completions + SSE.
#   blake3: snapshot-key hashing over token-id byte sequences.
#   uuid:   v7 ids for OpenAI tool-call ids.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal", "io-util", "time"] }
axum = "0.8.9"
blake3 = "1.8.5"
uuid = { version = "1.23.2", features = ["v7"] }
# Combinators on tokio mpsc / futures Streams used by SSE handler.
futures-util = "0.3"

