[workspace]
resolver = "2"
members = [
    "crates/v4flash-hip",
    "crates/phase0",
    "crates/phase1",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Approved deps (user sign-off 2026-05-23). Versions verified against crates.io.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
color-eyre = "0.6.5"
# eyre is re-exported by color-eyre; library code uses eyre::Result and binaries
# install the color-eyre handler in main().
